name: xarid_market
description: "Xarid — 100% oflayn ishlaydigan zamonaviy marketplace ilovasi. Barcha ma'lumotlar telefonda saqlanadi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Lokal ma'lumotlar bazasi (server yo'q — hammasi telefon xotirasida)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/products/
    - assets/brand/
