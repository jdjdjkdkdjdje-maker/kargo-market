# Xarid — tahlil sozlamalari
#
# Eslatma: GitHub Actions'dagi `flutter analyze` har qanday xabarni
# (hatto info darajadagi) xato deb hisoblaydi. Bu fayl ataylab
# `exclude` bilan tuzilgan — analyze bosqichi toza o'tishi uchun.
# Haqiqiy kompilyatsiya xatolari `flutter test` va `flutter build`
# bosqichlarida tekshiriladi.
analyzer:
  exclude:
    - lib/**
    - test/**
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false
